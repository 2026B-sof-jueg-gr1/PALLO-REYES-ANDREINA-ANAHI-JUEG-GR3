<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Sylva Game</title>
  <style>
    html, body { margin: 0; height: 100%; background: #070d12; overflow: hidden; }
    #juego { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    canvas { display: block; touch-action: none; }

    /* Aviso para girar el celular (el juego se ve en horizontal) */
    #girar {
      display: none; position: fixed; inset: 0; z-index: 10;
      background: #070d12; color: #cfeee6;
      font-family: Georgia, "Times New Roman", serif; font-size: 20px;
      align-items: center; justify-content: center; text-align: center; padding: 24px;
    }
    @media (orientation: portrait) and (max-width: 700px) { #girar { display: flex; } }
  </style>
</head>
<body>
  <div id="juego"></div>
  <div id="girar">Gira el celular en horizontal para jugar.</div>

  <!-- 1. Primero Phaser 4 desde el CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
  <!-- 2. Después el juego (módulos de JavaScript, sin compilar) -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
