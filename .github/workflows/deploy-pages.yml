name: Publicar juego en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Verificar archivos publicables
        run: test -f mi-primer-juego/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos del juego
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./mi-primer-juego

      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
